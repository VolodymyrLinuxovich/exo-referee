<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Redshift, explore the Kepler field</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Geist:wght@300;400;500;600&family=Newsreader:ital,opsz,wght@1,6..72,400&display=swap"
      rel="stylesheet"
    />
    <style>
      :root {
        --space: #03050b;
        --ink: #eef1f6;
        --ink-2: #a9b1c2;
        --ink-3: #6d7588;
        --line: rgba(255, 255, 255, 0.1);
        --planet: #cfe3ff;
        --cand: #ffc56b;
        --fp: #ff7a59;
        --good: #5fd39a;
        --sans: "Geist", -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
        --serif: "Newsreader", Georgia, serif;
      }
      * {
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        height: 100%;
        background: var(--space);
        color: var(--ink);
        font: 400 15px/1.5 var(--sans);
        overflow: hidden;
        -webkit-font-smoothing: antialiased;
      }
      em {
        font-family: var(--serif);
        font-style: italic;
        font-weight: 400;
      }
      canvas {
        display: block;
      }
      #sky {
        position: fixed;
        inset: 0;
        width: 100%;
        height: 100%;
        cursor: grab;
        touch-action: none;
      }
      #sky.drag {
        cursor: grabbing;
      }
      #sky.hot {
        cursor: pointer;
      }

      header {
        position: fixed;
        top: 0;
        left: 0;
        right: 0;
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 18px 28px;
        pointer-events: none;
        z-index: 3;
        background: linear-gradient(to bottom, rgba(3, 5, 11, 0.85), rgba(3, 5, 11, 0));
      }
      header > * {
        pointer-events: auto;
      }
      .logo {
        display: flex;
        align-items: center;
        gap: 10px;
        font-weight: 600;
        text-decoration: none;
        color: var(--ink);
      }
      .logo i {
        width: 16px;
        height: 16px;
        border-radius: 50%;
        background: radial-gradient(circle at 35% 35%, #fff, #7fb2ff 45%, #1b3a7a);
        box-shadow: 0 0 12px rgba(127, 178, 255, 0.6);
      }
      h1 {
        font: 500 22px var(--sans);
        margin: 0;
        letter-spacing: -0.01em;
      }
      h1 em {
        color: #cfe0ff;
      }
      .legend {
        display: flex;
        gap: 8px;
      }
      .chip {
        display: inline-flex;
        align-items: center;
        gap: 8px;
        border: 1px solid var(--line);
        background: rgba(10, 14, 26, 0.6);
        backdrop-filter: blur(8px);
        color: var(--ink-2);
        border-radius: 999px;
        padding: 6px 13px;
        font: 500 13px var(--sans);
        cursor: pointer;
        transition: opacity 0.2s;
      }
      .chip b {
        width: 8px;
        height: 8px;
        border-radius: 50%;
        background: var(--c);
        box-shadow: 0 0 8px var(--c);
      }
      .chip.off {
        opacity: 0.35;
      }
      .chip span {
        color: var(--ink-3);
        font-weight: 400;
      }

      body.sys-open #hint,
      body.sys-open header {
        opacity: 0;
        pointer-events: none;
      }
      #hint {
        transition: opacity 0.4s;
        position: fixed;
        left: 50%;
        bottom: 34px;
        transform: translateX(-50%);
        z-index: 3;
        display: flex;
        gap: 10px;
        align-items: center;
      }
      .btn {
        white-space: nowrap;
        border: 1px solid rgba(255, 255, 255, 0.22);
        background: rgba(10, 14, 26, 0.7);
        backdrop-filter: blur(8px);
        color: var(--ink);
        border-radius: 999px;
        height: 42px;
        padding: 0 18px;
        font: 500 14px var(--sans);
        cursor: pointer;
      }
      .btn.solid {
        background: var(--ink);
        color: var(--space);
        border-color: var(--ink);
      }
      .btn:hover {
        transform: translateY(-1px);
      }
      #hint .say {
        color: var(--ink-2);
        font-size: 14px;
        margin-right: 6px;
      }

      #tip {
        position: fixed;
        z-index: 4;
        pointer-events: none;
        background: rgba(10, 14, 26, 0.92);
        border: 1px solid var(--line);
        border-radius: 10px;
        padding: 8px 11px;
        font-size: 13px;
        opacity: 0;
        transition: opacity 0.12s;
        white-space: nowrap;
      }
      #tip .s {
        color: var(--ink-3);
      }

      /* the system view */
      #sys {
        position: fixed;
        inset: 0;
        z-index: 5;
        display: grid;
        grid-template-columns: 1.25fr 1fr;
        gap: 0;
        opacity: 0;
        pointer-events: none;
        transition: opacity 0.55s ease;
        background: radial-gradient(80% 90% at 30% 45%, rgba(12, 18, 38, 0.97), rgba(3, 5, 11, 0.99));
      }
      #sys.on {
        opacity: 1;
        pointer-events: auto;
      }
      #stage {
        position: relative;
      }
      #stage canvas {
        width: 100%;
        height: 100%;
      }
      #info {
        padding: 96px 56px 40px 20px;
        display: flex;
        flex-direction: column;
        justify-content: center;
        transform: translateX(24px);
        transition: transform 0.6s ease;
      }
      #sys.on #info {
        transform: none;
      }
      .status {
        display: inline-flex;
        align-self: flex-start;
        gap: 8px;
        align-items: center;
        font: 600 12.5px var(--sans);
        letter-spacing: 0.08em;
        padding: 5px 11px;
        border-radius: 999px;
        background: color-mix(in srgb, var(--c) 16%, transparent);
        color: var(--c);
        margin-bottom: 16px;
      }
      #name {
        font: 500 46px/1.05 var(--sans);
        letter-spacing: -0.03em;
        margin: 0 0 6px;
      }
      #alias {
        color: var(--ink-3);
        margin: 0 0 26px;
        font-size: 15px;
      }
      .facts {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 18px 26px;
        margin-bottom: 26px;
      }
      .fact .v {
        font: 500 28px var(--sans);
        letter-spacing: -0.02em;
      }
      .fact .k {
        color: var(--ink-3);
        font-size: 13px;
      }
      #score {
        border: 1px solid var(--line);
        border-radius: 14px;
        padding: 16px 18px;
        background: rgba(10, 14, 26, 0.6);
        margin-bottom: 22px;
      }
      #score .top {
        display: flex;
        justify-content: space-between;
        align-items: baseline;
        margin-bottom: 10px;
      }
      #score .top b {
        font: 500 24px var(--sans);
      }
      #score .bar {
        height: 6px;
        border-radius: 6px;
        background: rgba(255, 255, 255, 0.08);
        overflow: hidden;
      }
      #score .bar i {
        display: block;
        height: 100%;
        width: 0;
        background: linear-gradient(90deg, #ffc56b, #5fd39a);
        transition: width 1.1s cubic-bezier(0.2, 0.8, 0.2, 1);
      }
      #score p {
        margin: 10px 0 0;
        color: var(--ink-3);
        font-size: 12.5px;
      }
      .sibs {
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
        margin: -6px 0 22px;
      }
      .sibs:empty {
        display: none;
      }
      .sib {
        border: 1px solid var(--line);
        background: rgba(10, 14, 26, 0.6);
        color: var(--ink-2);
        border-radius: 999px;
        padding: 5px 11px;
        font: 500 12.5px var(--sans);
        cursor: pointer;
      }
      .sib b {
        display: inline-block;
        width: 7px;
        height: 7px;
        border-radius: 50%;
        background: var(--c);
        margin-right: 7px;
        vertical-align: 1px;
      }
      .sib.on {
        color: var(--ink);
        border-color: rgba(255, 255, 255, 0.45);
      }
      #earthy {
        color: var(--good);
        font-weight: 500;
        margin: -10px 0 18px;
        display: none;
      }
      .row {
        display: flex;
        gap: 10px;
        flex-wrap: wrap;
      }
      #close {
        position: absolute;
        top: 22px;
        right: 26px;
        z-index: 6;
      }
      @media (max-width: 880px) {
        #sys {
          grid-template-columns: 1fr;
          grid-template-rows: 46vh 1fr;
        }
        #info {
          padding: 10px 24px 30px;
          overflow-y: auto;
          justify-content: flex-start;
        }
        #hint {
          flex-wrap: wrap;
          justify-content: center;
          width: calc(100% - 32px);
        }
        #hint .say {
          display: none;
        }
        .legend .chip span {
          display: none;
        }
        #name {
          font-size: 34px;
        }
        h1 {
          display: none;
        }
      }
    </style>
  </head>
  <body>
    <canvas
      id="sky"
      aria-label="The Kepler field: every planet signal at its real position in the sky"
    ></canvas>

    <header>
      <a class="logo" href="index.html"><i></i>Redshift</a>
      <h1>The Kepler field. <em>Click a star.</em></h1>
      <div class="legend">
        <button class="chip" data-d="0" style="--c: var(--planet)">
          <b></b>Planets <span id="n0"></span>
        </button>
        <button class="chip" data-d="2" style="--c: var(--cand)">
          <b></b>Unresolved <span id="n2"></span>
        </button>
        <button class="chip" data-d="1" style="--c: var(--fp)">
          <b></b>False positives <span id="n1"></span>
        </button>
      </div>
    </header>

    <div id="hint">
      <span class="say"
        ><span id="count">9,564</span> real signals from NASA's Kepler telescope, at their true
        positions.</span
      >
      <button class="btn solid" id="maybe">Show one that might be real</button
      ><button class="btn" id="random">Surprise me</button>
    </div>
    <div id="tip"></div>

    <section id="sys" aria-live="polite">
      <button class="btn" id="close">Back to the sky</button>
      <div id="stage"><canvas id="orbit"></canvas></div>
      <div id="info">
        <div class="status" id="status"></div>
        <h2 id="name"></h2>
        <p id="alias"></p>
        <p id="earthy">Earth-sized and temperate</p>
        <div class="facts" id="facts"></div>
        <div class="sibs" id="sibs"></div>
        <div id="score">
          <div class="top"><span>Redshift's planet score</span><b id="sv"></b></div>
          <div class="bar"><i id="sb"></i></div>
          <p>
            Our model's ranking for a candidate NASA has not resolved. A pointer for follow-up, not a
            discovery.
          </p>
        </div>
        <div class="row">
          <button class="btn solid" id="next">Another one that might be real</button
          ><button class="btn" id="back2">Back to the sky</button>
        </div>
      </div>
    </section>

    <script>
      "use strict";
      const DPR = Math.min(devicePixelRatio || 1, 2);

      const COL = { 0: [207, 227, 255], 1: [255, 122, 89], 2: [255, 197, 107] };

      const NAME = { 0: "CONFIRMED PLANET", 1: "FALSE POSITIVE", 2: "UNRESOLVED CANDIDATE" };

      const STATUS_C = { 0: "var(--good)", 1: "var(--fp)", 2: "var(--cand)" };

      let K = [],
        SYS = {},
        show = { 0: true, 1: true, 2: true };

      /* ---------------- the sky ---------------- */
      const sky = document.getElementById("sky"),
        sx = sky.getContext("2d");

      let W,
        H,
        cam = { x: 0, y: 0, s: 1 },
        fit = { cx: 0, cy: 0, s: 1 },
        bg = [],
        hover = null,
        t0 = performance.now();

      function size() {
        W = innerWidth;
        H = innerHeight;
        sky.width = W * DPR;
        sky.height = H * DPR;
        sx.setTransform(DPR, 0, 0, DPR, 0, 0);
        bg = Array.from({ length: Math.round((W * H) / 1800) }, () => ({
          x: Math.random() * W,
          y: Math.random() * H,
          r: Math.random() ** 3 * 1.2 + 0.2,
          a: Math.random() * 0.5 + 0.1,
        }));
        refit();
        if (K.length) {
          frame();
        }
      }

      // RA/Dec to a flat plane around the field centre (RA scaled by cos Dec)
      const P = o => [-(o.ra - 290.7) * Math.cos((44.5 * Math.PI) / 180), -(o.dec - 44.5)];

      function toScreen(o) {
        const [x, y] = o.xy;
        return [W / 2 + (x * fit.s - cam.x) * cam.s, H / 2 + (y * fit.s - cam.y) * cam.s];
      }

      function frame() {
        const now = performance.now();
        sx.clearRect(0, 0, W, H);

        // A faint blue glow in one corner, so the sky is not a flat black.
        const g = sx.createRadialGradient(W * 0.3, H * 0.35, 0, W * 0.3, H * 0.35, Math.max(W, H) * 0.8);
        g.addColorStop(0, "rgba(40,60,120,.20)");
        g.addColorStop(1, "rgba(0,0,0,0)");
        sx.fillStyle = g;
        sx.fillRect(0, 0, W, H);

        // Distant background stars first, then the Kepler signals on top of them.
        for (const s of bg) {
          sx.globalAlpha = s.a;
          sx.fillStyle = "#fff";
          sx.fillRect(s.x, s.y, s.r, s.r);
        }
        sx.globalAlpha = 1;

        // Draw false positives first and planets last, so real planets are never hidden under a red dot.
        for (const d of [1, 2, 0]) {
          if (!show[d]) {
            continue;
          }
          const [r, gg, b] = COL[d];
          for (const o of K) {
            if (o.d !== d) {
              continue;
            }
            const [x, y] = toScreen(o);
            if (x < -10 || y < -10 || x > W + 10 || y > H + 10) {
              continue;
            }
            const tw = 0.75 + 0.25 * Math.sin(now / 700 + o.ph);
            const rad = o.size * Math.min(2.4, Math.max(0.8, Math.sqrt(cam.s)));
            sx.fillStyle = `rgba(${r},${gg},${b},${(d === 1 ? 0.55 : 0.9) * tw})`;
            sx.beginPath();
            sx.arc(x, y, rad, 0, 6.283);
            sx.fill();
            if (d === 0 && rad > 1.6) {
              sx.fillStyle = `rgba(${r},${gg},${b},.10)`;
              sx.beginPath();
              sx.arc(x, y, rad * 3, 0, 6.283);
              sx.fill();
            }
          }
        }
        if (hover) {
          const [x, y] = toScreen(hover);
          sx.strokeStyle = "rgba(255,255,255,.85)";
          sx.lineWidth = 1.2;
          sx.beginPath();
          sx.arc(x, y, 9 + 2 * Math.sin(now / 200), 0, 6.283);
          sx.stroke();
        }
      }

      let skyRunning = false;

      function skyLoop() {
        if (sysOn) {
          skyRunning = false;
          return;
        }
        frame();
        requestAnimationFrame(skyLoop);
      }

      function startSky() {
        if (!skyRunning) {
          skyRunning = true;
          requestAnimationFrame(skyLoop);
        }
      }

      // fit the whole field to the window; recomputed on every resize
      let span = null;

      function refit() {
        if (span) {
          fit.s = Math.min(W / span.x, H / span.y) * 0.82;
        }
      }

      /* pan, zoom, hover, tap (mouse, pen and touch) */
      // Which signal is under the pointer? The nearest one within a few pixels, ignoring hidden categories.
      function hitTest(px, py, radius) {
        let best = null,
          bd = radius;
        for (const o of K) {
          if (!show[o.d]) {
            continue;
          }
          const [x, y] = toScreen(o),
            dd = Math.hypot(x - px, y - py);
          if (dd < bd) {
            bd = dd;
            best = o;
          }
        }
        return best;
      }

      const tip = document.getElementById("tip");

      function showTip(o, px, py) {
        if (!o) {
          tip.style.opacity = 0;
          return;
        }
        tip.replaceChildren(document.createTextNode((o.k || o.n) + " "));
        const sub = document.createElement("span");
        sub.className = "s";
        sub.textContent = NAME[o.d].toLowerCase() + (o.R ? `, ${o.R} Earth radii` : "");
        tip.append(sub);
        tip.style.left = Math.min(px + 14, innerWidth - 240) + "px";
        tip.style.top = py + 14 + "px";
        tip.style.opacity = 1;
      }

      function setHover(o, px, py) {
        hover = o;
        sky.classList.toggle("hot", !!o);
        showTip(o, px, py);
      }

      const pts = new Map(); // active pointers, for drag and pinch

      let drag = null,
        pinch = null;
      sky.addEventListener("pointerdown", e => {
        sky.setPointerCapture(e.pointerId);
        pts.set(e.pointerId, { x: e.clientX, y: e.clientY });
        if (pts.size === 2) {
          const [a, b] = [...pts.values()];
          pinch = { d: Math.hypot(a.x - b.x, a.y - b.y), s: cam.s };
          drag = null;
          return;
        }
        const r = e.pointerType === "mouse" ? 14 : 26; // fingers get a bigger target
        drag = {
          x: e.clientX,
          y: e.clientY,
          cx: cam.x,
          cy: cam.y,
          moved: false,
          hit: hitTest(e.clientX, e.clientY, r),
        };
        sky.classList.add("drag");
      });
      sky.addEventListener("pointermove", e => {
        if (pts.has(e.pointerId)) {
          pts.set(e.pointerId, { x: e.clientX, y: e.clientY });
        }
        if (pinch && pts.size === 2) {
          const [a, b] = [...pts.values()],
            d = Math.hypot(a.x - b.x, a.y - b.y);
          cam.s = Math.min(40, Math.max(0.6, (pinch.s * d) / pinch.d));
          return;
        }
        if (drag) {
          const dx = e.clientX - drag.x,
            dy = e.clientY - drag.y;
          if (Math.abs(dx) + Math.abs(dy) > 6) {
            drag.moved = true;
          }
          if (drag.moved) {
            cam.x = drag.cx - dx / cam.s;
            cam.y = drag.cy - dy / cam.s;
            setHover(null);
          }
          return;
        }
        if (e.pointerType === "mouse") {
          const o = hitTest(e.clientX, e.clientY, 14);
          setHover(o, e.clientX, e.clientY);
        }
      });

      function endPointer(e) {
        pts.delete(e.pointerId);
        if (pts.size < 2) {
          pinch = null;
        }
        sky.classList.remove("drag");
        if (drag && !drag.moved && drag.hit && e.type === "pointerup") {
          openSystem(drag.hit);
        }
        drag = null;
      }
      sky.addEventListener("pointerup", endPointer);
      sky.addEventListener("pointercancel", endPointer);
      sky.addEventListener("pointerleave", e => {
        if (e.pointerType === "mouse") {
          setHover(null);
        }
      });
      sky.addEventListener(
        "wheel",
        e => {
          e.preventDefault();
          const k = Math.exp(-e.deltaY * 0.0015),
            ns = Math.min(40, Math.max(0.6, cam.s * k));
          const mx = (e.clientX - W / 2) / cam.s + cam.x,
            my = (e.clientY - H / 2) / cam.s + cam.y;
          cam.s = ns;
          cam.x = mx - (e.clientX - W / 2) / cam.s;
          cam.y = my - (e.clientY - H / 2) / cam.s;
        },
        { passive: false }
      );

      function setShow(d, on) {
        show[d] = on;
        document.querySelector(`.chip[data-d="${d}"]`).classList.toggle("off", !on);
        setHover(null);
      }
      document.querySelectorAll(".chip").forEach(c =>
        c.addEventListener("click", () => {
          const d = +c.dataset.d;
          setShow(d, !show[d]);
        })
      );

      /* fly the camera to a star, then open it */
      let flying = false;

      // Glide the camera to a star, then call `then`. Only one flight at a time, so double clicks do nothing.
      function flyTo(o, then) {
        if (!o || flying) {
          return;
        }
        flying = true;
        const [x, y] = o.xy,
          from = { ...cam },
          to = { x: x * fit.s, y: y * fit.s, s: 9 },
          T = 1100,
          s0 = performance.now();
        (function step(now) {
          const t = Math.min(1, (now - s0) / T),
            e = t < 0.5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2;
          cam.x = from.x + (to.x - from.x) * e;
          cam.y = from.y + (to.y - from.y) * e;
          cam.s = from.s * Math.pow(to.s / from.s, e);
          if (t < 1) {
            requestAnimationFrame(step);
          } else {
            flying = false;
            then();
          }
        })(s0);
      }

      const candidates = () => K.filter(o => o.d === 2 && o.p != null).sort((a, b) => b.p - a.p);

      let maybeIdx = 0;

      function pickMaybe() {
        const c = candidates();
        if (!c.length) {
          return null;
        }
        if (!show[2]) {
          setShow(2, true);
        }
        const o = c[maybeIdx % Math.min(40, c.length)];
        maybeIdx++;
        return o;
      }
      document.getElementById("maybe").onclick = () => {
        const o = pickMaybe();
        if (!o) {
          return;
        }
        hover = o;
        flyTo(o, () => openSystem(o));
      };
      document.getElementById("random").onclick = () => {
        let pool = K.filter(o => show[o.d] && o.R && o.Rs);
        if (!pool.length) {
          pool = K.filter(o => o.R && o.Rs);
        }
        if (!pool.length) {
          return;
        }
        const o = pool[Math.floor(Math.random() * pool.length)];
        hover = o;
        flyTo(o, () => openSystem(o));
      };

      /* ---------------- the system view ---------------- */
      const sys = document.getElementById("sys"),
        oc = document.getElementById("orbit"),
        ox = oc.getContext("2d");

      let sysOn = false,
        cur = null,
        curve = [];

      // star colour from temperature (rough blackbody ramp)
      // Turn a star temperature into a colour: cool stars look orange-red, hot ones blue-white.
      function starRGB(T) {
        T = Math.max(3000, Math.min(9500, T || 5700));
        const stops = [
          [3000, [255, 150, 90]],
          [4200, [255, 196, 140]],
          [5300, [255, 232, 200]],
          [5800, [255, 244, 228]],
          [7000, [228, 236, 255]],
          [9500, [190, 210, 255]],
        ];
        for (let i = 1; i < stops.length; i++) {
          if (T <= stops[i][0]) {
            const [t0, a] = stops[i - 1],
              [t1, b] = stops[i],
              f = (T - t0) / (t1 - t0);
            return a.map((v, j) => Math.round(v + (b[j] - v) * f));
          }
        }
        return stops[stops.length - 1][1];
      }

      const esc = t =>
        String(t).replace(
          /[&<>"']/g,
          c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" })[c]
        );

      function fact(v, k) {
        return `<div class="fact"><div class="v">${esc(v)}</div><div class="k">${esc(k)}</div></div>`;
      }

      function fmt(x, d) {
        return x == null ? "unknown" : (+x).toLocaleString("en-US", { maximumFractionDigits: d });
      }

      // Fill the side panel for one planet and start the orbit animation for its whole system.
      function openSystem(o, keep) {
        const wasOn = sysOn;
        cur = o;
        if (!keep) {
          curve = [];
        }
        sysOn = true;
        const st = document.getElementById("status");
        st.style.setProperty("--c", STATUS_C[o.d]);
        st.textContent = NAME[o.d];
        document.getElementById("name").textContent = o.k || o.n;
        document.getElementById("alias").textContent = o.k
          ? `${o.n} in the Kepler catalog`
          : "Kepler Object of Interest";
        document.getElementById("facts").innerHTML =
          fact(o.R ? `${fmt(o.R, 1)}×` : "unknown", "size of Earth") +
          fact(o.P ? `${fmt(o.P, o.P < 10 ? 2 : 0)} days` : "unknown", "one orbit") +
          fact(o.T ? `${fmt(o.T, 0)} K` : "unknown", "planet temperature") +
          fact(o.S != null ? `${fmt(o.S, o.S < 10 ? 2 : 0)}×` : "unknown", "sunlight vs Earth");
        document.getElementById("earthy").style.display =
          o.R && o.R < 2 && o.S != null && o.S > 0.25 && o.S < 2 ? "block" : "none";
        const sc = document.getElementById("score"),
          sb = document.getElementById("sb");
        sc.style.display = o.p != null ? "block" : "none";
        sb.style.width = "0";
        if (o.p != null) {
          document.getElementById("sv").textContent = o.p >= 0.995 ? ">99%" : Math.round(o.p * 100) + "%";
          setTimeout(() => (sb.style.width = Math.round(o.p * 100) + "%"), 250);
        }
        document.getElementById("next").style.display = o.d === 2 ? "" : "none";
        const sib = SYS[o.sys] || [o],
          box = document.getElementById("sibs");
        box.innerHTML =
          sib.length > 1
            ? sib
                .map(
                  (q, i) =>
                    `<button class="sib${q === o ? " on" : ""}" data-i="${i}" style="--c:${STATUS_C[q.d]}"><b></b>${esc(q.k ? q.k.split(" ").pop() : q.n.split(".")[1])}</button>`
                )
                .join("")
            : "";
        box
          .querySelectorAll(".sib")
          .forEach(btn => (btn.onclick = () => openSystem(sib[+btn.dataset.i], true)));
        sys.classList.add("on");
        document.body.classList.add("sys-open");
        document.getElementById("tip").style.opacity = 0;
        if (!wasOn) {
          sizeOrbit();
        }
        startSys();
      }

      function closeSystem() {
        sys.classList.remove("on");
        document.body.classList.remove("sys-open");
        sysOn = false;
        setHover(null);
        const from = { ...cam },
          s0 = performance.now();
        (function step(now) {
          const t = Math.min(1, (now - s0) / 900),
            e = 1 - Math.pow(1 - t, 3);
          cam.x = from.x * (1 - e);
          cam.y = from.y * (1 - e);
          cam.s = from.s * Math.pow(1 / from.s, e);
          if (t < 1) {
            requestAnimationFrame(step);
          }
        })(s0);
        startSky();
      }
      document.getElementById("close").onclick = closeSystem;
      document.getElementById("back2").onclick = closeSystem;
      document.getElementById("next").onclick = () => {
        const o = pickMaybe();
        if (o) {
          openSystem(o);
        }
      };
      addEventListener("keydown", e => {
        if (e.key === "Escape" && sysOn) {
          closeSystem();
        }
      });

      let OW, OH;

      function sizeOrbit() {
        const r = oc.getBoundingClientRect();
        OW = r.width;
        OH = r.height;
        oc.width = OW * DPR;
        oc.height = OH * DPR;
        ox.setTransform(DPR, 0, 0, DPR, 0, 0);
      }
      addEventListener("resize", () => {
        size();
        if (sysOn) {
          sizeOrbit();
        }
      });

      let sysRunning = false;

      function startSys() {
        if (!sysRunning) {
          sysRunning = true;
          requestAnimationFrame(drawSystem);
        }
      }

      function drawSystem(now) {
        if (!sysOn) {
          sysRunning = false;
          return;
        }
        const o = cur,
          sib = SYS[o.sys] || [o],
          cx = OW / 2,
          cy = OH * 0.42;
        ox.clearRect(0, 0, OW, OH);
        ox.globalAlpha = 0.6;
        for (let i = 0; i < 120; i++) {
          const sx2 = (i * 97.13) % OW,
            sy2 = (i * 53.71) % (OH * 0.8);
          ox.fillStyle = "#fff";
          ox.fillRect(sx2, sy2, 0.9, 0.9);
        }
        ox.globalAlpha = 1;

        // the star, sized by its real radius and coloured by its real temperature
        const Rstar = Math.min(OW, OH) * 0.11 * Math.min(1.6, Math.max(0.6, Math.sqrt(o.Rs || 1)));
        const [r, g, b] = starRGB(o.Ts);
        const glow = ox.createRadialGradient(cx, cy, Rstar * 0.2, cx, cy, Rstar * 3.2);
        glow.addColorStop(0, `rgba(${r},${g},${b},.55)`);
        glow.addColorStop(1, "rgba(0,0,0,0)");
        ox.fillStyle = glow;
        ox.beginPath();
        ox.arc(cx, cy, Rstar * 3.2, 0, 6.283);
        ox.fill();

        // every planet of this star: orbit size from Kepler's third law (a ~ P^2/3), inner planets lap faster
        const Pmax = Math.max(...sib.map(q => q.P || 1));
        const Amax = Math.min(OW * 0.46, Rstar * 5.2),
          Amin = Rstar * 2.3; // wide enough that transits are brief, as real ones are
        const bodies = sib.map(q => {
          const A = Amin + (Amax - Amin) * Math.pow((q.P || 1) / Pmax, 2 / 3),
            Bm = A * 0.16;
          const lap = 3200 + 5200 * Math.pow((q.P || 1) / Pmax, 1 / 3);
          const ang = ((now / lap + q.ph) % 1) * 6.283;
          const rp = Math.max(
            3,
            Math.min(Rstar * 0.4, ((Rstar * ((q.R || 1) / 109.1)) / Math.max(0.3, o.Rs || 1)) * 6)
          );
          return {
            q,
            A,
            Bm,
            x: cx + A * Math.cos(ang),
            y: cy + Bm * Math.sin(ang),
            front: Math.sin(ang) > 0,
            rp,
            sel: q === o,
          };
        });
        for (const p of bodies) {
          ox.strokeStyle = p.sel ? "rgba(207,227,255,.4)" : "rgba(255,255,255,.1)";
          ox.lineWidth = p.sel ? 1.3 : 1;
          ox.beginPath();
          ox.ellipse(cx, cy, p.A, p.Bm, 0, 0, 6.283);
          ox.stroke();
        }
        const planet = p => {
          const hot = (p.q.T || 300) > 900,
            pg = ox.createRadialGradient(p.x - p.rp * 0.4, p.y - p.rp * 0.4, p.rp * 0.1, p.x, p.y, p.rp);
          pg.addColorStop(0, hot ? "#ffd2b0" : "#dbeeff");
          pg.addColorStop(1, hot ? "#5a2410" : "#18324f");
          ox.globalAlpha = p.sel ? 1 : 0.75;
          ox.fillStyle = pg;
          ox.beginPath();
          ox.arc(p.x, p.y, p.rp, 0, 6.283);
          ox.fill();
          ox.globalAlpha = 1;
          if (p.sel) {
            ox.strokeStyle = "rgba(255,255,255,.7)";
            ox.lineWidth = 1;
            ox.beginPath();
            ox.arc(p.x, p.y, p.rp + 5, 0, 6.283);
            ox.stroke();
          }
        };
        bodies.filter(p => !p.front).forEach(planet);
        const sg = ox.createRadialGradient(cx - Rstar * 0.3, cy - Rstar * 0.3, 0, cx, cy, Rstar);
        sg.addColorStop(0, "#fffdf8");
        sg.addColorStop(0.6, `rgb(${r},${g},${b})`);
        sg.addColorStop(1, `rgb(${Math.round(r * 0.7)},${Math.round(g * 0.6)},${Math.round(b * 0.5)})`);
        ox.fillStyle = sg;
        ox.beginPath();
        ox.arc(cx, cy, Rstar, 0, 6.283);
        ox.fill();

        // transits: a planet in front of the star shows as its shadow and dims the light curve
        let dim = 0;
        for (const p of bodies.filter(p => p.front)) {
          const onDisk = Math.abs(p.x - cx) < Rstar + p.rp;
          if (onDisk) {
            ox.fillStyle = "#04060c";
            ox.beginPath();
            ox.arc(p.x, p.y, p.rp, 0, 6.283);
            ox.fill();
            const overlap = Math.max(0, Math.min(1, (Rstar + p.rp - Math.abs(p.x - cx)) / (2 * p.rp)));
            dim += overlap * Math.min(0.6, Math.max(0.06, Math.sqrt((p.q.dep || 500) / 1e6) * 3));
          } else {
            planet(p);
          }
        }
        curve.push(1 - Math.min(0.8, dim));
        if (curve.length > 360) {
          curve.shift();
        }
        const top = OH * 0.74,
          hh = OH * 0.14,
          l0 = OW * 0.1,
          l1 = OW * 0.9;
        ox.strokeStyle = "rgba(255,255,255,.08)";
        ox.beginPath();
        ox.moveTo(l0, top);
        ox.lineTo(l1, top);
        ox.stroke();
        ox.strokeStyle = o.d === 1 ? "#ff7a59" : o.d === 2 ? "#ffc56b" : "#5fd39a";
        ox.lineWidth = 2;
        ox.beginPath();
        curve.forEach((v, i) => {
          const x = l0 + ((l1 - l0) * i) / 359,
            y = top + (1 - v) * hh * 1.4 + Math.sin(i * 1.7) * 0.8;
          i ? ox.lineTo(x, y) : ox.moveTo(x, y);
        });
        ox.stroke();
        ox.fillStyle = "#6d7588";
        ox.font = "400 12px Geist, sans-serif";
        ox.fillText(
          sib.length > 1
            ? `starlight the telescope records, ${sib.length} signals around this star`
            : "starlight the telescope records",
          l0,
          top + hh * 1.5 + 18
        );
        const dipText = o.dep ? `real dip ${fmt(o.dep, 0)} parts per million, drawn larger` : "";
        // On narrow screens the second caption goes on its own line, so the two do not overlap.
        if (OW < 600) {
          ox.fillText(dipText, l0, top + hh * 1.5 + 36);
        } else {
          ox.textAlign = "right";
          ox.fillText(dipText, l1, top + hh * 1.5 + 18);
          ox.textAlign = "left";
        }
        requestAnimationFrame(drawSystem);
      }

      /* ---------------- load the real data ---------------- */
      fetch("explore.json")
        .then(r => {
          if (!r.ok) {
            throw new Error(`explore.json ${r.status}`);
          }
          return r.json();
        })
        .then(d => {
          const ix = Object.fromEntries(d.cols.map((c, i) => [c, i]));
          K = d.rows.map(r => {
            const o = {};
            for (const c of d.cols) {
              o[c] = r[ix[c]];
            }
            o.xy = P(o);
            o.ph = Math.random() * 6.283;
            o.size = o.d === 1 ? 1.1 : Math.min(3.2, 1.1 + Math.log10((o.R || 1) + 1) * 1.3);
            o.sys = o.n.split(".")[0];
            return o;
          });
          for (const o of K) {
            (SYS[o.sys] = SYS[o.sys] || []).push(o);
          }
          for (const k in SYS) {
            SYS[k].sort((a, b) => (a.P || 0) - (b.P || 0));
          }
          const xs = K.map(o => o.xy[0]),
            ys = K.map(o => o.xy[1]);
          const spanX = Math.max(...xs) - Math.min(...xs),
            spanY = Math.max(...ys) - Math.min(...ys);
          span = { x: spanX, y: spanY };
          for (const dd of [0, 1, 2]) {
            document.getElementById("n" + dd).textContent = K.filter(o => o.d === dd).length.toLocaleString(
              "en-US"
            );
          }
          document.getElementById("count").textContent = K.length.toLocaleString("en-US");
          size();
          startSky();
        })
        .catch(err => {
          document.querySelector("#hint .say").textContent =
            "The Kepler data did not load. Refresh the page to try again.";
          console.error(err);
        });
      size();
    </script>
  </body>
</html>
